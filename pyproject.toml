[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-ai-engineering"
version = "0.1.0"
description = "Metal kernels and settings for machine learning on Apple Silicon, built and measured on an M3 Max."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.7"]

[project.optional-dependencies]
transformers = ["transformers>=5.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
